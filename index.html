<style>
/* Layout: one paper page at a time on a blurred-photo desk; the page swings away on its left spine. Hotspots (◉) open a photo sheet with prices and links. */
:root{
  --desk:#CDD3D2; --desk-ink:#1C2A32; --desk-muted:#56656C; --veil:rgba(232,236,235,.72);
  --pp:#F7F5F0; --pp-2:#EDEAE3; --pp-line:rgba(19,33,43,.12); --pp-ink:#13212B; --pp-ink2:#3C4D58; --pp-muted:#74838A;
  --cover:#0F2738; --foil1:#E7B07E; --foil2:#B36A36;
  --jade:#0E8A80; --copper:#B5652E; --danube:#3B5BA5; --adriatic:#18507F; --eco:#0E8A80; --std:#13212B;
  --sea:#DCE6E8; --land:#F7F8F5; --land-on:#E3EEEA; --border:#B4C2C4;
  --display-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --display-lat:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.22,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#0A1419;--desk-ink:#E2EAEC;--desk-muted:#8C9DA4;--veil:rgba(8,16,21,.72);color-scheme:dark}}
:root[data-theme="dark"]{--desk:#0A1419;--desk-ink:#E2EAEC;--desk-muted:#8C9DA4;--veil:rgba(8,16,21,.72);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--desk-ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:3px}

/* desk backdrop */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden}
.backdrop img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;opacity:0;transition:opacity 1.2s ease;transform:scale(1.08)}
.backdrop img.on{opacity:1}
.backdrop::after{content:"";position:absolute;inset:0;background:var(--veil)}

.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:10px;padding-block:max(12px,env(safe-area-inset-top,0px)) 8px}
.brand{font-family:var(--display-lat);font-style:italic;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand b{font-family:var(--display-cn);font-style:normal;font-weight:900;font-size:15px;margin-left:8px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.seg{display:inline-flex;background:color-mix(in oklab,var(--desk-ink) 10%,transparent);border-radius:999px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;color:var(--desk-muted);font-weight:500;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.seg button.on{background:var(--desk-ink);color:var(--desk)}
.music{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in oklab,var(--desk-ink) 20%,transparent);background:color-mix(in oklab,var(--desk-ink) 5%,transparent);color:var(--desk-ink);border-radius:999px;padding:7px 13px 7px 11px;font-size:12.5px;cursor:pointer;}
.eq i:nth-child(2){height:10px}.eq i:nth-child(3){height:4px}.eq i:nth-child(4){height:8px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:2px;height:6px;background:currentColor;border-radius:1px}
.music.on .eq i{animation:eq 1.1s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:-.4s}.music.on .eq i:nth-child(3){animation-delay:-.75s}.music.on .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

.view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;perspective:2400px}
.deck{position:relative;flex:none}
.deck::before,.deck::after{content:"";position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:#E9E5DD;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.deck::before{transform:translate(6px,5px);background:#DFDAD0}
.deck::after{transform:translate(3px,2.5px)}
.shadow{position:absolute;inset:14px 4px -16px 10px;border-radius:12px;background:rgba(0,0,0,.35);filter:blur(22px);z-index:-1}
.side{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid color-mix(in oklab,var(--desk-ink) 18%,transparent);background:color-mix(in oklab,var(--desk) 55%,transparent);color:var(--desk-ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background .3s,opacity .3s;z-index:3}
.side svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.side:hover{transform:translateY(-50%) scale(1.07);background:var(--desk-ink);color:var(--desk)}
.side:disabled{opacity:0;pointer-events:none}
.side .lbl{position:absolute;top:60px;font-size:11px;white-space:nowrap;color:var(--desk-muted);opacity:0;transition:opacity .3s;pointer-events:none}
.side:hover .lbl{opacity:1}
.bottombar{display:flex;align-items:center;gap:12px;padding-block:8px max(14px,env(safe-area-inset-bottom,0px))}
.pill{border:1px solid color-mix(in oklab,var(--desk-ink) 20%,transparent);background:color-mix(in oklab,var(--desk-ink) 5%,transparent);color:var(--desk-ink);border-radius:999px;font-size:12.5px;font-weight:500;padding:8px 15px;cursor:pointer;flex:none;}
.prog{flex:1;min-width:0;position:relative;height:28px;display:flex;align-items:center;cursor:pointer}
.prog .tr{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:color-mix(in oklab,var(--desk-ink) 15%,transparent)}
.prog .fl{position:absolute;left:0;height:3px;border-radius:3px;background:var(--desk-ink);transition:width .6s var(--ease)}
.prog .tk{position:absolute;width:1px;height:9px;background:color-mix(in oklab,var(--desk-ink) 30%,transparent)}
.prog .tk span{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--desk-muted);white-space:nowrap}
.folio{font-family:var(--mono);font-size:12px;color:var(--desk-muted);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.mnav{display:none;width:40px;height:40px;border-radius:50%;border:1px solid color-mix(in oklab,var(--desk-ink) 20%,transparent);background:transparent;color:var(--desk-ink);font-size:18px;cursor:pointer;flex:none}
.mnav:disabled{opacity:.3}

/* sheets */
.sheet{position:absolute;inset:0;z-index:1;visibility:hidden;transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 10px 10px 4px;overflow:hidden}
.sheet.cur{visibility:visible;z-index:5}
.sheet.under{visibility:visible;z-index:4}
.sheet.turning{visibility:visible;z-index:6;will-change:transform}
.sheet .shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.35) 70%,rgba(0,0,0,.12))}
.sheet .gloss{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:21;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%)}
.sheet.under .dim{opacity:1}
.dim{position:absolute;inset:0;pointer-events:none;z-index:19;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 55%);transition:opacity .2s}
.pg{position:absolute;inset:0;background:var(--pp);color:var(--pp-ink);display:flex;flex-direction:column;font-size:13.5px;line-height:1.62;box-shadow:inset 22px 0 26px -22px rgba(0,0,0,.3)}
.pg::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(130% 90% at 60% 0%,rgba(255,255,255,.6),rgba(255,255,255,0) 60%),repeating-linear-gradient(0deg,rgba(19,33,43,.011) 0 1px,transparent 1px 3px)}
.pg-in{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:34px 38px 54px;scrollbar-width:thin;scrollbar-color:var(--pp-line) transparent;overscroll-behavior:contain}
.rh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--pp-muted);margin-bottom:14px}
.fo{position:absolute;z-index:2;bottom:16px;left:38px;right:38px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--pp-muted);pointer-events:none}
.fo b{font-family:var(--display-lat);font-size:14px;color:var(--pp-ink);font-weight:500}
.corner{position:absolute;right:0;bottom:0;width:54px;height:54px;z-index:3;cursor:pointer;border:0;padding:0;background:linear-gradient(225deg,transparent 50%,rgba(19,33,43,.10) 50%,#E4E0D7 60%,transparent 61%);transition:width .35s var(--ease),height .35s var(--ease)}
.corner:hover{width:78px;height:78px}

/* entrance */
.live .a{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.live .kb{animation:unveil 1.3s var(--ease) both}
@keyframes unveil{from{clip-path:inset(0 0 0 100%);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}

/* type */
.eb{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--pp-muted)}
.h1{font-family:var(--display-cn);font-weight:900;font-size:32px;line-height:1.15;text-wrap:balance;margin:6px 0 0}
.h2{font-family:var(--display-cn);font-weight:900;font-size:23px;line-height:1.25;text-wrap:balance;margin:2px 0 0}
.p{color:var(--pp-ink2);margin:10px 0 0}
.sm{font-size:12px;color:var(--pp-muted)}
a{color:inherit}
.pg a.lk{color:var(--c,var(--jade));text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--c,var(--jade)) 35%,transparent)}
.pg a.lk:hover{border-bottom-color:currentColor}
.num{font-variant-numeric:tabular-nums}

/* prices */
.pr{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--mono);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pr .s{color:var(--std);font-weight:500;transition:opacity .3s}
.pr .e{color:var(--eco);transition:opacity .3s}
.pr .e::before{content:"/ ";color:var(--pp-muted)}
[data-ver="std"] .pr .e{opacity:.55}
[data-ver="eco"] .pr .s{opacity:.42;text-decoration:line-through;text-decoration-thickness:1px}
[data-ver="eco"] .pr .e{font-weight:700}
.tag{display:inline-block;font-size:11px;line-height:1.4;border-radius:4px;padding:1px 6px;background:color-mix(in oklab,var(--eco) 12%,transparent);color:var(--eco);margin-top:3px}

/* hotspots */
.hs{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;border:0;cursor:pointer;background:color-mix(in oklab,var(--c,var(--jade)) 11%,transparent);color:var(--c,var(--jade));font-size:11px;font-weight:500;padding:2px 9px 2px 6px;border-radius:999px;margin-left:6px;transition:background .25s,color .25s,transform .25s var(--ease)}
.hs:hover{background:var(--c,var(--jade));color:#fff;transform:translateY(-1px)}
.hs .dot{position:relative;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.hs .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.hs-pin{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:var(--pp-ink);font-size:11.5px;font-weight:500;padding:6px 12px 6px 8px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.hs-pin:hover{transform:translateY(-2px)}
.hs-pin .dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--c,var(--jade))}
.hs-pin .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c,var(--jade));animation:ping 2.2s ease-out infinite}
.coach{position:fixed;z-index:40;pointer-events:none;background:var(--pp-ink);color:var(--pp);font-size:12.5px;padding:9px 13px;border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s var(--ease);max-width:240px}
.coach.on{opacity:1;transform:none}
.coach::after{content:"";position:absolute;left:22px;top:100%;border:7px solid transparent;border-top-color:var(--pp-ink)}

/* cover */
.cover{position:absolute;inset:0;background:var(--cover);color:#EAF0F2;overflow:hidden}
.cover .ph{position:absolute;inset:0;overflow:hidden}
.cover .ph img{width:100%;height:100%;object-fit:cover}
.cover .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,27,40,.92) 0%,rgba(10,27,40,.55) 38%,rgba(10,27,40,.15) 60%,rgba(10,27,40,.85) 100%)}
.cover .ct{position:absolute;left:42px;right:42px;top:46px;z-index:2}
.cover .eb{color:#A9BCC4}
.cover h1{font-family:var(--display-cn);font-weight:900;font-size:62px;line-height:1.02;margin:14px 0 0}
.foil{background:linear-gradient(100deg,var(--foil2),var(--foil1) 35%,#FBE3C6 50%,var(--foil1) 65%,var(--foil2));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.live .foil{animation:sheen 3.6s ease-in-out .4s both}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
.cover .sub{font-family:var(--display-lat);font-style:italic;font-size:22px;margin-top:12px}
.cover .rule{height:1px;background:linear-gradient(90deg,var(--foil1),transparent);margin-top:20px;width:55%}
.cover .stats{position:absolute;left:42px;right:42px;bottom:40px;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.cover .stats b{display:block;font-family:var(--display-lat);font-size:30px;font-weight:500;line-height:1.1}
.cover .stats > div > span{font-size:11px;color:#B9C8CE;letter-spacing:.06em}
.cover .open{position:absolute;right:30px;top:50%;z-index:3;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:11px;letter-spacing:.2em;opacity:.85;pointer-events:none}
.cover .open i{width:1px;height:46px;background:linear-gradient(#fff,transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.cover .credit{position:absolute;right:12px;bottom:8px;font-size:9px;color:rgba(255,255,255,.55);z-index:2}

/* toc */
.toc{display:grid;margin-top:16px}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dotted var(--pp-line)}
.toc button:hover .tt{color:var(--jade)}
.toc button:focus-visible{outline:2px solid var(--jade)}
.toc .n{font-family:var(--display-lat);font-size:16px;color:var(--pp-muted)}
.toc .tt{font-size:13.5px;font-weight:500;transition:color .2s}
.toc .pn{font-family:var(--mono);font-size:11px;color:var(--pp-muted)}
.toc .grp{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--pp-muted);margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--pp-ink)}

/* totals */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.vcard{border-radius:12px;padding:15px;border:1px solid var(--pp-line);transition:background .4s,border-color .4s,transform .4s var(--ease),color .4s}
.vcard .k{font-size:11.5px;color:var(--pp-muted);letter-spacing:.1em}
.vcard .t{font-family:var(--display-lat);font-size:36px;line-height:1.05;margin-top:6px}
.vcard .pp{font-size:12px;color:var(--pp-ink2)}
[data-ver="std"] .vcard.vs,[data-ver="eco"] .vcard.ve{background:var(--pp-ink);color:var(--pp);border-color:var(--pp-ink);transform:translateY(-2px)}
[data-ver="std"] .vcard.vs .k,[data-ver="std"] .vcard.vs .pp,[data-ver="eco"] .vcard.ve .k,[data-ver="eco"] .vcard.ve .pp{color:#C9D3D7}
.legend2{display:grid;gap:9px;margin-top:16px}
.legend2 div{display:flex;gap:10px;align-items:center}

/* map */
svg.mp{display:block;width:100%;height:auto;border-radius:10px}
.m-sea{fill:var(--sea)}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt.fly{stroke:var(--copper);stroke-width:1.6;stroke-dasharray:5 5}
.rt.train{stroke:var(--jade);stroke-width:3}
.rt.bus{stroke:var(--danube);stroke-width:2.8;stroke-dasharray:1 5}
.rt.mute{opacity:.18}
.trav{fill:#fff;stroke:var(--pp-ink);stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .4s}
.mk text{paint-order:stroke;stroke:var(--sea);stroke-linejoin:round}
.mk .nm{font-family:var(--display-lat);font-style:italic;fill:var(--pp-ink)}
.mk .cn{font-family:var(--body);fill:var(--pp-muted)}
.mk .dt{font-family:var(--mono);fill:var(--copper)}
.mk.mute{opacity:.4}
.mk.go{cursor:pointer}
.mk.go:hover .nm{fill:var(--jade)}
.mk .pulse{fill:none;stroke:var(--pp-ink);transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.clab{font-family:var(--mono);letter-spacing:.18em;fill:var(--pp-muted);text-anchor:middle}
.mlegend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--pp-muted);margin-top:8px}
.mlegend i{display:inline-block;width:22px;border-top:2px solid;vertical-align:middle;margin-right:6px}

/* cities */
.cities{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cty{all:unset;cursor:pointer;display:block;border-radius:12px;overflow:hidden;background:var(--pp-2);position:relative}
.cty .im{aspect-ratio:16/10;overflow:hidden}
.cty img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.cty:hover img{transform:scale(1.06)}
.cty .tx{padding:8px 11px 11px;border-top:3px solid var(--c)}
.cty h4{margin:0;font-family:var(--display-lat);font-style:italic;font-weight:500;font-size:21px;color:var(--c);line-height:1.1}
.cty .m{font-size:11.5px;color:var(--pp-ink2);line-height:1.5;margin-top:2px}
.cty .hs-pin{top:10px;right:10px;padding:4px 10px 4px 7px;font-size:10.5px}
.rib{margin-top:16px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.rib .d{font-family:var(--mono);font-size:9.5px;color:var(--pp-muted);text-align:center}
.rib .d b{display:block;font-family:var(--display-lat);font-size:15px;color:var(--pp-ink);font-weight:500}
.rib .b{height:20px;border-radius:5px;background:var(--c);transform-origin:left}
.live .rib .b{animation:grow .7s var(--ease) both;animation-delay:calc(var(--i) * 60ms + 300ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.rib .mv{font-size:10px;color:var(--pp-ink2);text-align:center;line-height:1.25}
.rib svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;display:block;margin:4px auto 2px}

/* day */
.hero{position:relative;margin:-34px -38px 0;height:250px;overflow:hidden;background:#2a3a44}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(10,20,26,.78))}
.hero .ov{position:absolute;left:38px;right:38px;bottom:18px;z-index:2;color:#fff;display:flex;align-items:flex-end;gap:16px}
.hero .bigd{font-family:var(--display-lat);font-size:82px;line-height:.78;letter-spacing:-.03em}
.hero .dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;opacity:.9;padding-bottom:4px}
.hero .dt b{display:block;font-family:var(--display-cn);font-size:12px;letter-spacing:.04em;font-weight:600}
.hero .rh2{position:absolute;top:18px;left:38px;right:38px;z-index:2;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.85)}
.hero .hs-pin{right:22px;bottom:22px;left:auto}
.hero .credit{position:absolute;right:14px;top:auto;bottom:6px;left:auto;z-index:2;font-size:9px;color:rgba(255,255,255,.6)}
.dtitle{margin-top:16px}
.stay{font-size:12px;color:var(--pp-ink2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;border-radius:999px;padding:3px 10px;background:var(--pp-2);color:var(--pp-ink2)}
.chip b{color:var(--pp-ink)}
.vig{margin-top:12px;position:relative}
.vig .cap{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:9.5px;color:var(--pp-muted);background:color-mix(in oklab,var(--pp) 85%,transparent);padding:2px 7px;border-radius:4px}
.walk{margin-top:12px;overflow-x:auto;padding-bottom:4px}
.wl{display:flex;align-items:flex-start;min-width:max-content}
.st{all:unset;display:flex;flex-direction:column;align-items:center;width:76px;text-align:center}
button.st{cursor:pointer}
button.st:hover span{color:var(--c)}
.st .o{width:12px;height:12px;border-radius:50%;background:var(--pp);border:2.5px solid var(--c);position:relative;z-index:1}
.st.k .o{background:var(--c)}
button.st .o::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--c);animation:ping 2.4s ease-out infinite}
.st span{font-size:10.5px;line-height:1.3;margin-top:5px}
.lg{flex:none;width:52px;margin:5px -32px 0;height:2px;background:color-mix(in oklab,var(--c) 45%,transparent);position:relative}
.lg.r{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 9px)}
.lg em{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:9px;color:var(--pp-muted);white-space:nowrap}
.meals{margin-top:12px;display:grid;gap:8px}
.meal{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding-top:8px;border-top:1px solid var(--pp-line)}
.meal .mt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--pp-muted);padding-top:2px}
.meal .ln{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meal .ln + .ln{margin-top:3px}
.meal .who{min-width:0;font-size:12px}
.meal .who i{font-style:normal;font-size:10px;font-weight:700;margin-right:5px;padding:0 4px;border-radius:3px}
.meal .who i.s{background:var(--pp-ink);color:var(--pp)}
.meal .who i.e{background:var(--eco);color:#fff}
[data-ver="eco"] .meal .ln.ls{opacity:.55}
[data-ver="std"] .meal .ln.le{opacity:.72}
.sh{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--pp-muted);padding-bottom:6px;border-bottom:1px solid var(--pp-ink)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--pp-line);align-items:start}
.row .tm{font-family:var(--mono);font-size:11px;color:var(--pp-muted);padding-top:1px}
.row .w{min-width:0;font-size:12.6px;line-height:1.55}
.row .w .m{display:block;font-size:11px;color:var(--pp-muted)}
.row.star .w > b:first-child{color:var(--c)}
.row.move{background:linear-gradient(90deg,color-mix(in oklab,var(--c) 9%,transparent),transparent 75%);margin-inline:-6px;padding-inline:6px;border-radius:6px}
.row .pr{flex-direction:column;align-items:flex-end;gap:0}
.row .pr .e::before{content:""}
.notes{margin-top:12px;display:grid;gap:5px}
.notes p{margin:0;font-size:11.5px;color:var(--pp-ink2);padding-left:13px;position:relative;line-height:1.55}
.notes p::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.notes p.w::before{background:var(--copper);border-radius:1px;transform:rotate(45deg)}
.subt{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:8px;border-top:1px solid var(--pp-ink);font-size:12px}

/* galleries */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.card{all:unset;cursor:pointer;display:block;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 0 var(--pp-line),0 8px 22px -16px rgba(19,33,43,.45);transition:transform .45s var(--ease),box-shadow .45s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 var(--pp-line),0 16px 30px -16px rgba(19,33,43,.5)}
.card:focus-visible{outline:2px solid var(--jade)}
.card .im{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--pp-2)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.card:hover img{transform:scale(1.07)}
.card .im .badge{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;background:rgba(255,255,255,.9);color:var(--pp-ink);padding:2px 7px;border-radius:999px}
.card .im .eye{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--c);transition:transform .3s var(--ease)}
.card .im .eye::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);animation:ping 2.4s ease-out infinite}
.card:hover .eye{transform:scale(1.12)}
.card .im .eye svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.card .tx{padding:9px 11px 11px}
.card .tx b{display:block;font-size:13px;line-height:1.35}
.card .tx .meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:3px;font-size:11px;color:var(--pp-muted)}
.noimg{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in oklab,var(--c) 70%,#0d1b24),color-mix(in oklab,var(--c) 35%,#0d1b24));color:rgba(255,255,255,.85);font-family:var(--display-lat);font-style:italic;font-size:19px;text-align:center;padding:12px}
.card.wide{grid-column:1 / -1}
.card.wide .im{aspect-ratio:21/9}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.t th{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.12em;color:var(--pp-muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--pp-ink)}
table.t td{padding:6px;border-bottom:1px solid var(--pp-line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.t tr.tot td{border-top:1px solid var(--pp-ink);border-bottom:0;font-weight:700}
table.t td.s{font-family:var(--mono);text-align:right;white-space:nowrap}
table.t td.e{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--eco)}
[data-ver="eco"] table.t td.s{opacity:.5}
[data-ver="std"] table.t td.e{opacity:.6}
[data-ver="eco"] table.t td.e{font-weight:700}

/* charts */
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--mono);font-size:9px;fill:var(--pp-muted)}
.gr{stroke:var(--pp-line);stroke-width:1}
.filt{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.filt button{border:1px solid var(--pp-line);background:transparent;color:var(--pp-ink2);font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:background .25s,color .25s}
.filt button i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.filt button.on{background:var(--pp-ink);color:var(--pp);border-color:var(--pp-ink)}
.bub{cursor:pointer;transition:transform .8s var(--ease),opacity .4s}
.bub .ring{fill:none;stroke-width:1.5;opacity:0;transition:opacity .25s}
.bub:hover .ring,.bub:focus .ring{opacity:1}
.bub.off{opacity:.12;pointer-events:none}
.live .bub circle.c0{animation:pop .7s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 300ms)}
@keyframes pop{from{r:0}}
.tip{position:absolute;pointer-events:none;background:var(--pp-ink);color:var(--pp);font-size:11.5px;line-height:1.45;border-radius:10px;padding:8px 11px;max-width:230px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;z-index:5;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:12.5px}
.tip em{display:block;font-style:normal;color:#9EE0D8;font-size:10.5px;margin-top:3px}
.band{cursor:pointer}
.band rect.bg{transition:opacity .3s}
.band:hover rect.bg{opacity:1!important}
.live .band rect.bar{animation:barin .9s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 250ms);transform-box:fill-box;transform-origin:left}
@keyframes barin{from{transform:scaleX(0)}to{transform:none}}
.bars2{display:grid;gap:7px;margin-top:12px}
.bar2{display:grid;grid-template-columns:104px minmax(0,1fr) 96px;gap:8px;align-items:center;font-size:12px}
.bar2 .tr{position:relative;height:16px}
.bar2 .tr i{position:absolute;left:0;border-radius:4px;transition:width 1s var(--ease),opacity .3s}
.bar2 .tr i.s{top:0;height:16px;background:color-mix(in oklab,var(--pp-ink) 18%,transparent)}
.bar2 .tr i.e{top:4px;height:8px;background:var(--eco)}
[data-ver="std"] .bar2 .tr i.e{opacity:.45}
.cap2{height:8px;border-radius:99px;background:var(--pp-2);margin-top:12px;position:relative;overflow:hidden}
.cap2 i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--jade),#7FCFC5);transition:width 1s var(--ease)}

.sc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.sc .c{border:1px solid var(--pp-line);border-radius:10px;padding:9px 11px;border-top:3px solid var(--c)}
.sc .c h5{margin:0;font-family:var(--display-lat);font-style:italic;font-weight:500;font-size:18px;color:var(--c)}
.sc .ch{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:5px}
.sc .ch span:first-child{min-width:0}

.ck{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--pp-line);cursor:pointer;font-size:12.5px}
.ck input{appearance:none;flex:none;width:16px;height:16px;border:1.5px solid var(--pp-muted);border-radius:4px;margin:2px 0 0;display:grid;place-content:center;cursor:pointer}
.ck input:checked{background:var(--jade);border-color:var(--jade)}
.ck input:checked::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck input:checked + span{color:var(--pp-muted);text-decoration:line-through}
.ck small{display:block;font-size:11px;color:var(--pp-muted)}
.cash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.cash div{border-top:3px solid var(--c);padding-top:6px;font-size:11.5px;color:var(--pp-ink2)}
.cash b{display:block;font-family:var(--display-lat);font-size:23px;color:var(--c);font-weight:500}
.credits{columns:2;column-gap:18px;font-size:10.5px;color:var(--pp-ink2);line-height:1.5;margin-top:10px}
.credits p{margin:0 0 6px;break-inside:avoid}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));visibility:hidden}
.lb.on{visibility:visible}
.lb .veil{position:absolute;inset:0;background:rgba(6,14,19,.62);opacity:0;transition:opacity .4s}
.lb.on .veil{opacity:1}
.lb .box{position:relative;width:min(980px,100%);max-height:calc(100dvh - 48px);display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);background:var(--pp);color:var(--pp-ink);border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);opacity:0;transform:translateY(18px) scale(.98);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.lb.on .box{opacity:1;transform:none}
.lb .ph{position:relative;background:#1b2730;min-height:320px;overflow:hidden}
.lb .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}
.lb .ph img.ld{opacity:0}

.lb .ph .credit{position:absolute;left:12px;bottom:10px;right:12px;font-size:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.lb .ph .credit a{color:inherit}
.lb .ph .nof{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0b8;font-size:12px}
.lb .info{padding:26px 26px 22px;overflow-y:auto;display:flex;flex-direction:column}
.lb .city{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}
.lb h3{font-family:var(--display-cn);font-weight:900;font-size:25px;line-height:1.2;margin:6px 0 0}
.lb .en{font-family:var(--display-lat);font-style:italic;font-size:16px;color:var(--pp-muted);margin-top:2px}
.lb .d{font-size:13.5px;color:var(--pp-ink2);margin-top:12px;line-height:1.7}
.lb .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lb .facts div{background:var(--pp-2);border-radius:10px;padding:8px 10px}
.lb .facts span{display:block;font-size:10.5px;color:var(--pp-muted);letter-spacing:.06em}
.lb .facts b{font-family:var(--mono);font-size:13px;font-weight:500}
.lb .facts .e b{color:var(--eco)}
.lb .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lb .links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid var(--pp-line);color:var(--pp-ink);transition:background .25s,color .25s}
.lb .links a:first-child{background:var(--pp-ink);color:var(--pp);border-color:var(--pp-ink)}
.lb .links a:hover{background:var(--c);color:#fff;border-color:var(--c)}
.lb .links svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.lb .jump{margin-top:auto;padding-top:16px}
.lb .jump button{border:0;background:none;color:var(--c);font-size:12.5px;font-weight:500;cursor:pointer;padding:0}
.lb .x{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--pp-ink);cursor:pointer;font-size:20px;line-height:1;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.lb .nx{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);cursor:pointer;color:var(--pp-ink);font-size:18px}
.lb .nx.l{left:12px}.lb .nx.r{right:12px}
.lb .cnt:empty{display:none}
.lb.nophoto .ph{display:none}.lb.nophoto .box{grid-template-columns:1fr;width:min(560px,100%)}
.lb .cnt{position:absolute;top:16px;left:14px;z-index:3;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px}

/* mobile */
@media (max-width:719px){
  .brand b{display:none}
  .music .t{display:none}
  .music{padding:8px 10px}
  .seg button{padding:7px 11px}
  .side{display:none}
  .mnav{display:grid;place-items:center}
  .prog .tk span{display:none}
  .pg-in{padding:24px 20px 48px}
  .hero{margin:-24px -20px 0;height:210px}
  .hero .ov,.hero .rh2{left:20px;right:20px}
  .hero .credit{right:10px}
  .hero .bigd{font-size:66px}
  .fo{left:20px;right:20px;bottom:12px}
  .cover .ct{left:26px;right:26px;top:34px}
  .cover h1{font-size:48px}
  .cover .stats{left:26px;right:26px;bottom:30px}
  .cover .stats b{font-size:24px}
  .cover .open{display:none}
  .corner{display:none}
  .h1{font-size:28px}.h2{font-size:21px}
  .gal{gap:9px}
  .bar2{grid-template-columns:84px minmax(0,1fr) 88px;font-size:11.5px}
  .credits{columns:1}
  .lb{padding:0;place-items:end center}
  .lb .box{grid-template-columns:1fr;border-radius:18px 18px 0 0;max-height:92dvh;transform:translateY(40px)}
  .lb .ph{min-height:0;aspect-ratio:4/3}
  .lb .info{padding:18px 20px max(20px,env(safe-area-inset-bottom,0px))}
}
/* ===== scrolling page layout ===== */
html{scroll-padding-top:76px}
.blk[id^="day-"]{scroll-margin-top:150px}
body{overflow-x:hidden;overflow-y:auto}
.stage{height:auto;display:block;padding:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));transition:background .4s,box-shadow .4s}
.topbar.solid{background:color-mix(in oklab,var(--desk) 94%,transparent);;box-shadow:0 1px 0 color-mix(in oklab,var(--desk-ink) 10%,transparent)}
.topbar::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--sp,0%);background:linear-gradient(90deg,var(--copper),var(--jade))}
.topbar:not(.solid){color:#fff}
.topbar:not(.solid) .seg{background:rgba(255,255,255,.14)}
.topbar:not(.solid) .seg button{color:rgba(255,255,255,.8)}
.topbar:not(.solid) .seg button.on{background:#fff;color:#13212B}
.topbar:not(.solid) .music{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.topbar:not(.solid) .nav a{color:rgba(255,255,255,.82)}
.brand{text-decoration:none;color:inherit}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{text-decoration:none;color:var(--desk-muted);font-size:13px;font-weight:500;padding:6px 11px;border-radius:999px;transition:background .3s,color .3s}
.nav a:hover{color:var(--desk-ink)}
.nav a.on{background:color-mix(in oklab,var(--desk-ink) 10%,transparent);color:var(--desk-ink)}
.topbar:not(.solid) .nav a.on{background:rgba(255,255,255,.16);color:#fff}
#main{position:relative;z-index:1;margin-top:-62px}

.herosec{position:relative;min-height:max(640px,100svh);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:48px;align-items:center;padding:110px max(24px,5vw) 90px;color:#fff;overflow:hidden;isolation:isolate}

 const masks = opt.anim? '<defs>'+Object.entries(RT).map(([id,[m,d]])=>`<mask id="rm-${opt.pre||''}${id}" maskUnits="userSpaceOnUse" x="-500" y="-500" width="2000" height="1800"><path class="mpath" d="${d}" pathLength="1" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/></mask>`).join('')+'</defs>' : '';
 const mks = MARK.map(([key,p,nm,cn,dt,dx,dy,a])=>{const mute = on && !on.includes(key);return `<g class="mk${mute?' mute':''}${opt.go?' go':''}" data-k="${key}" data-x="${p[0]}" data-y="${p[1]}" transform="translate(${p}) scale(${k})" ${opt.go?`tabindex="0" role="button" aria-label="${cn} ${dt}"`:''}><circle class="pulse" r="6"/><circle r="5.5" style="fill:var(--pp-ink);stroke:var(--sea);stroke-width:2"/><text class="nm" x="${dx}" y="${dy}" text-anchor="${a}" font-size="19" stroke-width="4">${nm}</text><text class="cn" x="${dx}" y="${dy+15}" text-anchor="${a}" font-size="10" stroke-width="3">${cn}</text><text class="dt" x="${dx}" y="${dy+28}" text-anchor="${a}" font-size="9.5" stroke-width="3">${dt}</text></g>`}).join('');
 if(opt.layer==='base'){ const rb=[44,28,14].map((w,i)=>`<use href="#ringG" style="stroke:color-mix(in oklab,var(--adriatic) ${8+i*4}%,transparent);stroke-width:${w*.42}"/>`).join(''); return `<svg class="lm-base" viewBox="-300 -300 1600 1380" width="1600" height="1380" aria-hidden="true"><rect class="m-sea" x="-500" y="-500" width="2000" height="1800"/>${rb}<use href="#landG"/></svg>`; }
 if(opt.layer==='top') return `<svg class="mp lm-top" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="随行程移动的地图">${masks}${labs}${routes}${opt.anim?'<circle class="trav" r="5.5" cx="-50" cy="-50"/>':''}${mks}</svg>`;
 return `<svg class="mp" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid slice" style="aspect-ratio:${opt.ar||'1.6'}" role="img" aria-label="路线地图">${masks}<rect class="m-sea" x="-500" y="-500" width="2000" height="1800"/>${ring}<use href="#landG"/>${labs}${routes}${opt.anim?'<circle class="trav" r="5.5" cx="-50" cy="-50"/>':''}${mks}</svg>`;
}

function setScale(svg,vbw){ const vb=svg._vb||svg.getAttribute('viewBox').split(' ').map(Number); const W=svg.clientWidth||600, H=svg.clientHeight||400;
 const slice=(svg.getAttribute('preserveAspectRatio')||'').includes('slice'); const ppu=slice?Math.max(W/vb[2],H/vb[3]):Math.min(W/vb[2],H/vb[3]);
 const k=Math.max(.12,.8/ppu), kr=Math.max(vb[2]/1000,.2);
 svg.querySelectorAll('.mk').forEach(m=>m.setAttribute('transform',`translate(${m.dataset.x},${m.dataset.y}) scale(${k})`));
 svg.querySelectorAll('.clab').forEach(x=>x.setAttribute('font-size',x.dataset.fs*k*.9));
 svg.querySelectorAll('use[data-w]').forEach(u=>u.style.strokeWidth=u.dataset.w*kr);
 const tv=svg.querySelector('.trav'); if(tv) tv.setAttribute('r',6*k);
}
function placeBase(svg,v){ const b=svg._base; if(!b) return; const W=svg.clientWidth, H=svg.clientHeight, s=Math.min(W/v[2],H/v[3]), ox=(W-v[2]*s)/2-v[0]*s, oy=(H-v[3]*s)/2-v[1]*s; b.style.transform=`translate3d(${(ox-300*s).toFixed(2)}px,${(oy-300*s).toFixed(2)}px,0) scale(${s.toFixed(4)})`; }
function flyMap(svg,to,dur=1200,cb){ const from=(svg._vb||svg.getAttribute('viewBox').split(' ').map(Number)).slice(); cancelAnimationFrame(svg._fa); const t0=performance.now(); if(RM) dur=0;
 if(svg._base) svg._base.style.willChange='transform';
 const st=ts=>{ let u=dur?Math.min(1,(ts-t0)/dur):1; u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2; const v=from.map((x,i)=>x+(to[i]-x)*u); svg._vb=v; svg.setAttribute('viewBox',v.map(n=>n.toFixed(2)).join(' ')); placeBase(svg,v); setScale(svg,v[2]);
  if(u<1) svg._fa=requestAnimationFrame(st); else { if(svg._base) svg._base.style.willChange='auto'; cb&&cb(); } };
 svg._fa=requestAnimationFrame(st); }
const dayOfCity = k => { let i=DAYS.findIndex(d=>d.focus===k); if(i<0) i=DAYS.findIndex(d=>d.on.includes(k)&&d.c===k); return Math.max(0,i); };

function travLoop(svg,paths,period){ cancelAnimationFrame(svg._tl); const dot=svg.querySelector('.trav'); if(!dot) return; if(!paths.length||RM){ dot.style.opacity=0; return; }
 const lens=paths.map(p=>p.getTotalLength()), tot=lens.reduce((a,b)=>a+b,0); let t0=null; dot.style.opacity=1;
 const f=ts=>{ if(svg._vis===false){ svg._tl=requestAnimationFrame(f); return; } if(t0==null) t0=ts; let u=((ts-t0)/period)%1*tot, i=0; while(i<lens.length-1&&u>lens[i]){u-=lens[i];i++} const pt=paths[i].getPointAtLength(Math.min(u,lens[i])); dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y); svg._tl=requestAnimationFrame(f); };
 svg._tl=requestAnimationFrame(f); }
function drawSegs(svg,ids,cb){ const ms=ids.map(id=>svg.querySelector(`mask[id$="${id}"] .mpath`)).filter(Boolean); if(RM||!ms.length){ ms.forEach(m=>{m.style.strokeDasharray='none'}); cb&&cb(); return; }
 let i=0; const nx=()=>{ if(i>=ms.length){ cb&&cb(); return; } const m=ms[i++], t0=performance.now(), dur=1000; const f=ts=>{ const k=Math.min(1,(ts-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; m.style.strokeDashoffset=(1-e).toFixed(4); if(k<1) requestAnimationFrame(f); else nx(); }; requestAnimationFrame(f); }; nx(); }

/* ================= MUSIC — classical × jazz × rock band, synthesised in the browser =================
   Band: electric bass, electric guitar, drum kit, piano, saxophone, trumpet, tuba, organ, violin.
   Four 8-bar sections loop: classical → jazz → rock → fusion. */
let NB=null; let AC=null, master=null, verb=null, dist=null, playing=false, schedT=null;
let tNext=0, step=0; const WALK={}, SOLO={};
const BPM=100, BEAT=60/BPM, BAR=BEAT*4;
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const PROG=[
 {r:45,v:[60,64,67,71],sc:[69,71,72,74,76,77,79]},{r:50,v:[60,64,65,69],sc:[69,71,72,74,76,77,79]},
 {r:43,v:[59,64,65,69],sc:[67,69,71,72,74,76,77]},{r:48,v:[59,62,64,67],sc:[67,69,71,72,74,76,79]},
 {r:41,v:[57,60,64,67],sc:[65,67,69,72,74,76,77]},{r:47,v:[57,62,65,69],r2:40,v2:[56,62,65,68],sc:[68,71,72,74,76,77,80]},
 {r:45,v:[60,64,67,71],sc:[69,71,72,74,76,77,79]},{r:40,v:[56,62,64,71],sc:[68,71,74,76,77,80,83]}];
const MEL=[[[76,1],[72,1],[71,1],[72,1]],[[81,2],[77,1],[76,1]],[[74,1],[71,1],[76,1],[74,1]],[[72,3],[71,1]],
 [[69,1],[72,1],[76,1],[81,1]],[[79,1],[77,1],[76,1],[74,1]],[[72,1],[76,1],[71,1],[69,1]],[[68,2],[71,2]]];
const SECTIONS=[{n:'classical',swing:.5},{n:'jazz',swing:.64},{n:'rock',swing:.54},{n:'fusion',swing:.6}];
function initAudio(){
 AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain(); master.gain.value=0;
 const comp=AC.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=2.5; comp.knee.value=12; comp.attack.value=.02; comp.release.value=.3;
 const eq=AC.createBiquadFilter(); eq.type='highshelf'; eq.frequency.value=6500; eq.gain.value=-7;
 const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=12000; lp.Q.value=.5;
 const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=32;
 master.connect(hp).connect(eq).connect(lp).connect(comp).connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); { const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
 verb=AC.createConvolver(); const len=Math.floor(AC.sampleRate*2.2), buf=AC.createBuffer(2,len,AC.sampleRate);
 for(let c=0;c<2;c++){ const d=buf.getChannelData(c); let y=0; for(let i=0;i<len;i++){ const tt=i/AC.sampleRate; const a=Math.exp(-tt*3.1); const k=.18+.6*Math.exp(-tt*2.5); y+= ( (Math.random()*2-1) - y)*k; d[i]=y*a*(i<AC.sampleRate*.012?i/(AC.sampleRate*.012):1); } } verb.buffer=buf;
 const vlp=AC.createBiquadFilter(); vlp.type='lowpass'; vlp.frequency.value=4800; const vhp=AC.createBiquadFilter(); vhp.type='highpass'; vhp.frequency.value=180;
 const vg=AC.createGain(); vg.gain.value=.38; verb.connect(vhp).connect(vlp).connect(vg).connect(master);
 dist=AC.createWaveShaper(); const cv=new Float32Array(2048); for(let i=0;i<2048;i++){const x=i/1024-1; cv[i]=Math.tanh(x*4.5)/Math.tanh(4.5);} dist.curve=cv; dist.oversample='4x';
 const cab=AC.createBiquadFilter(); cab.type='lowpass'; cab.frequency.value=2300; cab.Q.value=.6; const cab2=AC.createBiquadFilter(); cab2.type='lowpass'; cab2.frequency.value=3600; const mid=AC.createBiquadFilter(); mid.type='peaking'; mid.frequency.value=900; mid.gain.value=4;
 const cg=AC.createGain(); cg.gain.value=.42; dist.connect(mid).connect(cab).connect(cab2).connect(cg); pan(cg,-.35);
}
function pan(node,p,wet=.2){ const pn=AC.createStereoPanner?AC.createStereoPanner():null; if(pn){pn.pan.value=p; node.connect(pn); pn.connect(master); if(wet){const w=AC.createGain(); w.gain.value=wet; pn.connect(w).connect(verb);} } else { node.connect(master); } }
const osc=(type,f,t,end)=>{const o=AC.createOscillator(); o.type=type; o.frequency.value=f; o.start(t); o.stop(end); return o;};
function noise(t,dur){ const s=AC.createBufferSource(); s.buffer=NB; s.loop=true; s.start(t,Math.random()*1.5); s.stop(t+dur+.05); return s; }
function adsr(g,t,a,peak,d,s,rel,dur){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.linearRampToValueAtTime(peak*s,t+a+d); g.gain.setValueAtTime(peak*s,t+Math.max(a+d,dur)); g.gain.linearRampToValueAtTime(0,t+Math.max(a+d,dur)+rel); }
function vibrato(o,t,f,depth,delay=.2){ const l=AC.createOscillator(), g=AC.createGain(); l.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(depth,t+delay+.2); l.connect(g).connect(o.frequency); l.start(t); return l; }

/* ---- instruments ---- */
function piano(n,t,vel=.045,p=.1){ const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.004); g.gain.exponentialRampToValueAtTime(vel*.3,t+.4); g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
 const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(4200,t); f.frequency.exponentialRampToValueAtTime(1400,t+.6);
 [[1,'triangle',1],[2,'sine',.4],[3,'sine',.15],[4.02,'sine',.06]].forEach(([m,ty,a])=>{const o=osc(ty,NOTE(n)*m,t,t+1.9), og=AC.createGain(); og.gain.value=a; o.connect(og).connect(f);});
 f.connect(g); pan(g,p,.32); }
function violin(n,t,dur,vol=.026){ const end=t+dur+.25; const o=osc('sawtooth',NOTE(n),t,end), o2=osc('sawtooth',NOTE(n)*1.003,t,end); const l=vibrato(o,t,5.8,NOTE(n)*.007), l2=vibrato(o2,t,5.8,NOTE(n)*.007); l.stop(end); l2.stop(end);
 const f=AC.createBiquadFilter(); f.type='peaking'; f.frequency.value=2400; f.gain.value=3; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800; lp.Q.value=.5; const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=320;
 const g=AC.createGain(); adsr(g,t,.09,vol,.1,.85,.18,dur); o.connect(hp); o2.connect(hp); hp.connect(f).connect(lp).connect(g); pan(g,.3,.45); }
function sax(n,t,dur,vol=.034){ const end=t+dur+.2; const o=osc('sawtooth',NOTE(n),t,end); o.detune.setValueAtTime(-60,t); o.detune.linearRampToValueAtTime(0,t+.07); const l=vibrato(o,t,5,NOTE(n)*.008,.25); l.stop(end);
 const f1=AC.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=900; f1.Q.value=1.4; const f2=AC.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=2400; f2.Q.value=2.2; const g2=AC.createGain(); g2.gain.value=.55;
 const br=noise(t,dur+.1), bf=AC.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=1500; bf.Q.value=1.2; const bg=AC.createGain(); bg.gain.value=.025;
 const g=AC.createGain(); adsr(g,t,.045,vol,.1,.8,.12,dur); o.connect(f1).connect(g); o.connect(f2).connect(g2).connect(g); br.connect(bf).connect(bg).connect(g); pan(g,-.25,.38); }
function trumpet(n,t,dur,vol=.03){ const end=t+dur+.15; const o=osc('sawtooth',NOTE(n),t,end), o2=osc('sawtooth',NOTE(n),t,end); o2.detune.value=6; const l=vibrato(o,t,5.5,NOTE(n)*.005,.3); l.stop(end);
 const f=AC.createBiquadFilter(); f.type='lowpass'; f.Q.value=2; f.frequency.setValueAtTime(700,t); f.frequency.linearRampToValueAtTime(3200,t+.05); f.frequency.exponentialRampToValueAtTime(1900,t+.25);
 const g=AC.createGain(); adsr(g,t,.025,vol,.08,.75,.08,dur); o.connect(f); o2.connect(f); f.connect(g); pan(g,.35,.35); }
function tuba(n,t,dur,vol=.075){ const end=t+dur+.2; const o=osc('sawtooth',NOTE(n),t,end), o2=osc('triangle',NOTE(n),t,end);
 const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(260,t); f.frequency.linearRampToValueAtTime(620,t+.08); f.frequency.linearRampToValueAtTime(420,t+.3);
 const g=AC.createGain(); adsr(g,t,.06,vol,.1,.8,.12,dur); o.connect(f); o2.connect(f); f.connect(g); pan(g,0,.2); }
function ebass(n,t,dur,vol=.1){ const end=t+dur+.12; const o=osc('sawtooth',NOTE(n),t,end), s=osc('sine',NOTE(n),t,end);
 const f=AC.createBiquadFilter(); f.type='lowpass'; f.Q.value=3; f.frequency.setValueAtTime(1600,t); f.frequency.exponentialRampToValueAtTime(420,t+.18);
 const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(vol*.45,t+.25); g.gain.setValueAtTime(vol*.45,t+dur*.85); g.gain.linearRampToValueAtTime(0,end);
 const sg=AC.createGain(); sg.gain.value=.9; o.connect(f); s.connect(sg).connect(g); f.connect(g); pan(g,0,.05); }
function organ(notes,t,dur,vol=.012,leslie=6.4){ const end=t+dur+.2; const g=AC.createGain(); adsr(g,t,.03,vol,.05,1,.15,dur);
 const trem=AC.createGain(); trem.gain.value=1; const lf=osc('sine',leslie,t,end), lg=AC.createGain(); lg.gain.value=.22; lf.connect(lg).connect(trem.gain);
 notes.forEach(n=>[[.5,.55],[1,1],[1.5,.5],[2,.6],[3,.28],[4,.22]].forEach(([m,a])=>{const o=osc('sine',NOTE(n)*m,t,end), og=AC.createGain(); og.gain.value=a; o.connect(og).connect(trem);}));
 trem.connect(g); pan(g,-.15,.3); }
function guitar(root,t,dur,vol=.05,chord=[0,7,12]){ const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 chord.forEach(iv=>{const o=osc('sawtooth',NOTE(root+iv),t,t+dur+.05); o.detune.value=(Math.random()-.5)*10; o.connect(g);}); g.connect(dist); }
function strings(notes,t,dur,vol=.016){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200; const g=AC.createGain(); adsr(g,t,.6,vol,.1,1,.5,dur);
 notes.forEach(n=>[-8,0,8].forEach(det=>{const o=osc('sawtooth',NOTE(n),t,t+dur+.6); o.detune.value=det; o.connect(f);})); f.connect(g); pan(g,.15,.55); }
/* drum kit */
function kick(t,vol=.5){ const o=osc('sine',140,t,t+.4), g=AC.createGain(); o.frequency.exponentialRampToValueAtTime(42,t+.16); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.34); o.connect(g); pan(g,0,0);
 const c=noise(t,.015), cf=AC.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=2500; const cg=AC.createGain(); cg.gain.setValueAtTime(vol*.08,t); cg.gain.exponentialRampToValueAtTime(.0001,t+.015); c.connect(cf).connect(cg); pan(cg,0,0); }
function snare(t,vol=.16,brush=false){ const s=noise(t,.25), f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=brush?3000:1900; f.Q.value=.8; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(brush?vol*.35:vol,t+(brush?.02:.002)); g.gain.exponentialRampToValueAtTime(.0001,t+(brush?.22:.18)); s.connect(f).connect(g); pan(g,.05,.22);
 if(!brush){ const o=osc('triangle',190,t,t+.12), og=AC.createGain(); og.gain.setValueAtTime(vol*.7,t); og.gain.exponentialRampToValueAtTime(.0001,t+.1); o.connect(og); pan(og,.05,.1);} }
function hat(t,vol=.02,open=false){ vol*=.6; const s=noise(t,open?.3:.06), f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=8500; f.Q.value=.9; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+(open?.28:.045)); s.connect(f).connect(g); pan(g,.3,0); }
function ride(t,vol=.03){ vol*=.6; const s=noise(t,.45), f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=7200; f.Q.value=1.1; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.38); s.connect(f).connect(g); pan(g,-.3,.15);
 [1,1.47,2.09,2.71].forEach(m=>{const o=osc('square',540*m,t,t+.45), og=AC.createGain(); og.gain.setValueAtTime(vol*.16,t); og.gain.exponentialRampToValueAtTime(.0001,t+.5); o.connect(og); pan(og,-.3,.06);}); }
function crash(t,vol=.06){ vol*=.6; const s=noise(t,1.6), f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=6000; f.Q.value=.6; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+1.7); s.connect(f).connect(g); pan(g,.4,.3); }
function tom(t,f0,vol=.22){ const o=osc('sine',f0,t,t+.35), g=AC.createGain(); o.frequency.exponentialRampToValueAtTime(f0*.55,t+.25); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); pan(g,(f0-130)/200,.2); }

/* ---- composition ---- */
function walkNotes(bi){ const c=PROG[bi], nx=PROG[(bi+1)%8]; const r=c.r; const app=nx.r+(Math.random()<.5?1:-1);
 if(c.r2) return [r,r+3,c.r2,c.r2+4]; const opts=[[r,r+3,r+7,app],[r,r+7,r+10,app],[r,r+2,r+3,app],[r,r+12,r+7,app]]; return opts[Math.floor(Math.random()*opts.length)]; }
function soloBar(bi){ const sc=PROG[bi].sc, rhythms=[[0,1,2,3,5,6],[0,2,3,4,6,7],[1,2,4,5,6],[0,1,3,4,5,7],[0,3,4,6]]; const rh=rhythms[Math.floor(Math.random()*rhythms.length)]; let idx=2+Math.floor(Math.random()*3);
 return rh.map(e=>{ idx=Math.max(0,Math.min(sc.length-1,idx+[-2,-1,1,1,2][Math.floor(Math.random()*5)])); return [e,sc[idx]]; }); }
function scheduleEighth(t,s){
 const bar=Math.floor(s/8), e=s%8, beat=Math.floor(e/2), off=e%2, bi=bar%8, secI=Math.floor(bar/8)%4, sec=SECTIONS[secI].n;
 const half=(PROG[bi].r2&&beat>=2); const c=half?{r:PROG[bi].r2,v:PROG[bi].v2}:PROG[bi];
 const lastBar = bi===7;
 // section downbeat: crash
 if(bi===0&&e===0&&sec!=='classical') crash(t, sec==='rock'?.07:.045);
 /* PIANO */
 if(sec==='classical'){ const pat=[0,2,1,3,0,2,1,3]; piano(c.v[pat[e]],t,.042); if(e===0) piano(c.r+12,t,.03,-.1); }
 if(sec==='jazz' && (e===1||e===4&&bar%2===0||e===7&&bar%2===1)) c.v.forEach(n=>piano(n,t,.02));
 if(sec==='rock' && off===0) c.v.slice(0,3).forEach(n=>piano(n+12,t,.012));
 if(sec==='fusion'){ const pat=[0,1,2,3,2,1,0,3]; piano(c.v[pat[e]]+12,t,.022); }
 /* VIOLIN — the theme */
 if((sec==='classical'||sec==='rock'||sec==='fusion') && off===0){ let acc=0; for(const [n,len] of MEL[bi]){ if(acc===beat) violin(n+(sec==='rock'?12:0),t,len*BEAT*.95,sec==='rock'?.02:.026); acc+=len; } }
 /* STRINGS bed (classical) */
 if(sec==='classical' && (e===0||e===4&&PROG[bi].r2)) strings((half?PROG[bi].v2:PROG[bi].v).slice(0,3),t,PROG[bi].r2?BAR/2:BAR,.013);
 /* ORGAN — church chorale in classical, Leslie comping in jazz/rock/fusion */
 if(sec==='classical' && e===0 && bar%2===1) organ(PROG[bi].v.slice(0,3).map(n=>n-12),t,BAR*.95,.007,0.8);
 if(sec==='jazz' && e===0 && bar%2===0) organ(c.v,t,BAR*1.9,.006,5.8);
 if(sec==='rock' && (e===0||e===4)) organ(c.v.slice(0,3),t,BEAT*1.8,.01,6.8);
 if(sec==='fusion' && e===0) organ(c.v,t,BAR*.95,.008,6.4);
 /* TUBA — oom on 1 & 3 (classical), doubles the bass in fusion */
 if(sec==='classical' && off===0 && (beat===0||beat===2)) tuba(beat===0?c.r:c.r+7,t,BEAT*1.6,.07);
 if(sec==='fusion' && off===0 && (beat===0||beat===2)) tuba(c.r,t,BEAT*.9,.055);
 if(sec==='jazz' && bi%4===3 && off===0) tuba(c.r-0+[0,3,5,7][beat],t,BEAT*.8,.045);
 /* ELECTRIC BASS — walking (jazz/fusion), driving 8ths (rock) */
 if(sec==='jazz'||sec==='fusion'){ if(off===0){ const w=WALK[bar]||(WALK[bar]=walkNotes(bi)); ebass(w[beat]||c.r,t,BEAT*.85,.1); } }
 if(sec==='rock') ebass(c.r+(e===7?7:0),t,BEAT*.45,off?.075:.1);
 /* SAXOPHONE — improvised lines in jazz, melody in unison with violin in fusion */
 if(sec==='jazz' && bi%2===0){ const sb=SOLO[bar]||(SOLO[bar]=soloBar(bi)); sb.filter(x=>x[0]===e).forEach(x=>sax(x[1]-12,t,BEAT*.55,.032)); }
 if(sec==='fusion' && off===0){ let acc=0; for(const [n,len] of MEL[bi]){ if(acc===beat) sax(n-12,t,len*BEAT*.9,.026); acc+=len; } }
 /* TRUMPET — answers the sax in jazz, stabs in rock, harmony in fusion */
 if(sec==='jazz' && bi%2===1 && off===0){ const arp=[c.v[3],c.v[2],c.v[1],c.v[2]]; trumpet(arp[beat]+ (beat===0?0:0),t,BEAT*.7,.026); }
 if(sec==='rock' && (e===3||e===7) && bar%2===1){ trumpet(c.v[2],t,BEAT*.35,.028); sax(c.v[0]-12,t,BEAT*.35,.022); }
 if(sec==='fusion' && off===0 && bi%2===1){ let acc=0; for(const [n,len] of MEL[bi]){ if(acc===beat) trumpet(n-3-12+12,t,len*BEAT*.85,.018); acc+=len; } }
 /* ELECTRIC GUITAR — power-chord chug (rock), light stabs (fusion) */
 if(sec==='rock'){ const gr=c.r>45?c.r-12:c.r; guitar(gr+12,t,BEAT*(off?.32:.42),off?.035:.05); }
 if(sec==='fusion' && (e===2||e===6)) guitar(c.r+12,t,BEAT*.3,.03,[0,7,10,15]);
 /* DRUM KIT */
 if(sec==='jazz'||sec==='fusion'){ if(off===0||beat===1||beat===3){ if(!(off===1&&(beat===0||beat===2))) ride(t,sec==='fusion'?.03:.026); }
  if(off===0&&(beat===1||beat===3)) sec==='fusion'?snare(t,.11):snare(t,.12,true);
  if(sec==='fusion'&&(e===0||e===5)) kick(t,.3); if(sec==='jazz'&&e===0) kick(t,.15); if(off===0&&(beat===1||beat===3)) hat(t,.012); }
 if(sec==='rock'){ hat(t,off?.013:.022, e===7&&bar%2===1); if(off===0&&(beat===0||beat===2)) kick(t,.45); if(e===5) kick(t,.3); if(off===0&&(beat===1||beat===3)) snare(t,.16); }
 if(sec==='classical' && e===0 && bar%2===0) ride(t,.01);
 /* fills on the last bar of a section */
 if(lastBar && sec!=='classical' && e>=4){ tom(t,[220,180,140,110][e-4],.18); if(e===7) snare(t+BEAT*.25,.12); }
}
function tick(){ while(tNext<AC.currentTime+.45){ scheduleEighth(tNext,step); const sw=SECTIONS[Math.floor(Math.floor(step/8)/8)%4].swing; tNext += (step%2===0? sw : 1-sw)*BEAT; step++; if(step%64===0){ for(const k in WALK) if(+k<step/8-2) delete WALK[k]; for(const k in SOLO) if(+k<step/8-2) delete SOLO[k]; } } }
const mb=document.getElementById('music');
mb.addEventListener('click',()=>{
 if(!AC) initAudio(); if(AC.state==='suspended') AC.resume();
 playing=!playing; mb.classList.toggle('on',playing); mb.setAttribute('aria-pressed',playing); mb.querySelector('.t').textContent=playing?'暂停音乐':'背景音乐';
 const t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t);
 if(playing){ master.gain.linearRampToValueAtTime(.8,t+1.5); if(tNext<t) tNext=t+.1; tick(); schedT=setInterval(tick,40); }
 else { master.gain.linearRampToValueAtTime(0,t+.8); clearInterval(schedT); }
});
document.addEventListener('visibilitychange',()=>{ if(!AC||!playing) return; document.hidden? AC.suspend() : AC.resume(); });

/* boot */
boot();
</script>
